<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPath — Minimalist Educational Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* SAGE GREEN & DUSTY BLUE DESIGN SYSTEM */
    :root {
      /* Theme Primaries */
      --sage-primary: #3F5E4D;        /* Core Sage Green: grounded, scholarly, natural */
      --sage-hover: #324D3E;          /* Deep Sage */
      --sage-light: #EBF2ED;          /* Gentle sage tint */
      --sage-border: #C8D7CE;         /* Delicate sage contour */

      --dusty-blue: #4A6B82;          /* Core Dusty Blue: calm, focused, analytical */
      --dusty-blue-hover: #3C576C;    /* Deep Dusty Blue */
      --dusty-blue-light: #EEF4F8;    /* Gentle dusty blue tint */
      --dusty-blue-border: #CBD8E2;   /* Delicate dusty blue contour */

      /* System Foundations */
      --bg-primary: #FFFFFF;
      --bg-secondary: #F6F8F6;        /* Subtle natural sage-white canvas */
      --bg-card: #FFFFFF;
      --text-primary: #1C2721;        /* Deep pine-charcoal for crisp readability */
      --text-secondary: #586960;      /* Muted sage-slate supporting copy */
      --border: #DFE6E1;              /* Soft sage-tinted gray divider */
      --hover-bg: #EDF3EF;            /* Subtle interactive hover */

      /* Buttons & Controls */
      --btn-primary-bg: #3F5E4D;      /* Sage green primary buttons */
      --btn-primary-text: #FFFFFF;
      --input-bg: #FFFFFF;
      --input-border: #CBD7CE;
      --disabled: #A1B2A8;

      /* Feedback Colors */
      --success: #26733E;             /* Natural foliage green */
      --error: #B03A3A;               /* Terracotta crimson */
      --warning: #996215;             /* Warm amber */

      --radius: 8px;
      --radius-sm: 6px;
      --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.5;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TYPOGRAPHY */
    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
    h3 { font-size: 16px; }
    h4 { font-size: 14px; }

    p {
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.6;
    }

    a {
      color: var(--text-primary);
      text-decoration: none;
    }

    /* LUCIDE SVG ICONS */
    .icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      stroke-width: 1.85;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .icon-lg { width: 20px; height: 20px; }
    .icon-sm { width: 14px; height: 14px; }

    /* LAYOUT CONTAINERS */
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .main-content {
      flex: 1;
      padding: 32px 0 64px;
    }

    /* NAVIGATION */
    .navbar {
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid var(--sage-primary);
      background-color: var(--sage-primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .nav-link {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
    }

    .nav-link:hover {
      background-color: var(--hover-bg);
      color: var(--sage-primary);
    }

    .nav-link.active {
      background-color: var(--sage-light);
      color: var(--sage-primary);
      font-weight: 600;
      border-color: var(--sage-border);
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .user-pill:hover {
      border-color: var(--dusty-blue-border);
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background-color: var(--dusty-blue-light);
      border: 1px solid var(--dusty-blue-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--dusty-blue);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-stack);
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary-bg);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--sage-hover);
      border-color: var(--sage-hover);
    }

    .btn-secondary {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--hover-bg);
      border-color: var(--sage-border);
      color: var(--sage-primary);
    }

    .btn-accent {
      background-color: var(--dusty-blue);
      color: #FFFFFF;
      border-color: var(--dusty-blue);
    }

    .btn-accent:hover:not(:disabled) {
      background-color: var(--dusty-blue-hover);
      border-color: var(--dusty-blue-hover);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12.5px;
    }

    .btn-block {
      width: 100%;
    }

    /* CARDS */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-compact {
      padding: 18px;
    }

    .card-header {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--sage-border);
      background-color: var(--sage-light);
      color: var(--sage-primary);
    }

    .badge-blue {
      background-color: var(--dusty-blue-light);
      border-color: var(--dusty-blue-border);
      color: var(--dusty-blue);
    }

    .badge-success {
      background-color: #EDF7EE;
      border-color: #BDE2C7;
      color: var(--success);
    }

    .badge-error {
      background-color: #FDF2F2;
      border-color: #F3C7C7;
      color: var(--error);
    }

    .badge-warning {
      background-color: #FEF9EC;
      border-color: #F6DFB2;
      color: var(--warning);
    }

    /* FORM ELEMENTS */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-stack);
      font-size: 13.5px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--dusty-blue);
      box-shadow: 0 0 0 3px rgba(74, 107, 130, 0.12);
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: var(--disabled);
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    /* PROGRESS BAR */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--sage-primary);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-bar-fill-blue {
      background-color: var(--dusty-blue);
    }

    /* TABLES */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--bg-primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-secondary);
    }

    td {
      padding: 14px 16px;
      font-size: 13.5px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--hover-bg);
    }

    /* GRID UTILITIES */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .flex-gap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* CHIPS & FILTERS */
    .filter-chip {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .filter-chip:hover {
      background-color: var(--hover-bg);
      color: var(--sage-primary);
      border-color: var(--sage-border);
    }

    .filter-chip.active {
      background-color: var(--sage-primary);
      color: #FFFFFF;
      border-color: var(--sage-primary);
    }

    /* QUIZ OPTION CARDS */
    .quiz-option {
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .quiz-option:hover {
      background-color: var(--hover-bg);
      border-color: var(--dusty-blue-border);
    }

    .quiz-option.selected {
      border: 2px solid var(--dusty-blue);
      background-color: var(--dusty-blue-light);
      padding: 13px 15px; /* Adjust for 2px border */
    }

    .quiz-option.review-correct {
      border: 2px solid var(--success) !important;
      background-color: #EDF7EE !important;
      padding: 13px 15px;
    }

    .quiz-option.review-incorrect {
      border: 2px solid var(--error) !important;
      background-color: #FDF2F2 !important;
      padding: 13px 15px;
    }

    .option-letter {
      width: 26px;
      height: 26px;
      border: 1px solid var(--sage-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--sage-primary);
      background-color: var(--sage-light);
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .quiz-option.selected .option-letter {
      background-color: var(--dusty-blue);
      color: #FFFFFF;
      border-color: var(--dusty-blue);
    }

    .option-text {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.5;
      padding-top: 2px;
    }

    /* AI CHAT CONTAINER */
    .chat-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      height: 640px;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .chat-bubble {
      max-width: 82%;
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.6;
    }

    .chat-user {
      align-self: flex-end;
      background-color: var(--dusty-blue-light);
      border: 1px solid var(--dusty-blue-border);
      color: var(--text-primary);
    }

    .chat-assistant {
      align-self: flex-start;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .code-block {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      margin: 8px 0;
      color: var(--text-primary);
      overflow-x: auto;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(28, 39, 33, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 28px;
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .chat-layout { grid-template-columns: 1fr; height: auto; }
      .nav-links { display: none; }
      .nav-links.mobile-open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        background-color: var(--bg-primary);
        border-bottom: 1px solid var(--border);
        padding: 16px;
      }
    }

    /* NOTIFICATION TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background-color: var(--sage-primary);
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--sage-hover);
      box-shadow: 0 4px 12px rgba(63, 94, 77, 0.18);
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- GLOBAL NAVIGATION BAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <div class="nav-brand" onclick="navigateTo('home')">
        <div class="brand-mark">S</div>
        <span>StudyPath</span>
      </div>

      <nav>
        <ul class="nav-links" id="main-nav-links">
          <li><span class="nav-link" id="nav-dashboard" onclick="navigateTo('dashboard')"><svg class="icon"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</span></li>
          <li><span class="nav-link" id="nav-bank" onclick="navigateTo('question-bank')"><svg class="icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Question Bank</span></li>
          <li><span class="nav-link" id="nav-assistant" onclick="navigateTo('assistant')"><svg class="icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>AI Study Assistant</span></li>
          <li><span class="nav-link" id="nav-progress" onclick="navigateTo('progress')"><svg class="icon"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Progress</span></li>
        </ul>
      </nav>

      <div class="nav-user">
        <div id="auth-buttons-group" style="display: none;">
          <button class="btn btn-secondary btn-sm" onclick="navigateTo('auth')">Sign In</button>
          <button class="btn btn-primary btn-sm" onclick="navigateTo('auth')">Get Started</button>
        </div>
        <div id="user-profile-group" style="display: flex;" class="user-pill" onclick="navigateTo('profile')" title="View profile settings">
          <div class="user-avatar" id="nav-avatar-initials">AM</div>
          <span id="nav-user-name">Alex Morgan</span>
          <span class="badge badge-blue" id="nav-exam-badge" style="font-size: 11px; padding: 2px 6px;">JEE 2026</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="mobile-toggle-btn" style="display: none;" onclick="toggleMobileNav()">Menu</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER WHERE PAGES RENDER -->
  <main class="main-content" id="app-root">
    <!-- Dynamic page content injected here by JavaScript -->
  </main>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- MODAL CONTAINER (FOR TARGET PICKER OR CONFIRMATIONS) -->
  <div id="modal-container" style="display: none;"></div>

  <!-- APPLICATION SCRIPTS -->
  <script>
    /* ==========================================================================
       1. DATA STORE & INITIAL STATE
       ========================================================================== */
    const STORAGE_KEY_USER = 'studypath_user_v1';
    const STORAGE_KEY_HISTORY = 'studypath_history_v1';
    const STORAGE_KEY_SAVED = 'studypath_saved_questions_v1';

    /* ==========================================================================
       OLLAMA INTEGRATION (MODEL: gemma3:4b)
       ========================================================================== */
    const OLLAMA_CONFIG = {
      model: 'gemma3:4b',
      endpoint: 'http://localhost:11434',
      proxyEndpoint: '/api/chat',
      statusEndpoint: '/api/status',
      isConnected: false,
      isChecking: false,
      models: []
    };

    async function checkOllamaConnection(verbose = false) {
      OLLAMA_CONFIG.isChecking = true;
      let connected = false;

      // 1. Try server.js proxy status endpoint
      try {
        const res = await fetch(OLLAMA_CONFIG.statusEndpoint, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.online) {
            connected = true;
            OLLAMA_CONFIG.models = data.models || [];
          }
        }
      } catch (e) {
        // Fallback to direct check
      }

      // 2. If proxy not available (e.g. file:///), try direct fetch to Ollama API
      if (!connected) {
        try {
          const res = await fetch(`${OLLAMA_CONFIG.endpoint}/api/tags`, {
            method: 'GET',
            mode: 'cors'
          });
          if (res.ok) {
            const data = await res.json();
            connected = true;
            OLLAMA_CONFIG.models = data.models || [];
          }
        } catch (e) {
          connected = false;
        }
      }

      OLLAMA_CONFIG.isConnected = connected;
      OLLAMA_CONFIG.isChecking = false;

      if (verbose) {
        if (connected) {
          showToast(`Connected to Ollama (${OLLAMA_CONFIG.model})`);
        } else {
          showToast('Ollama offline. Run: ollama run gemma3:4b');
        }
      }

      // Update UI if on assistant or profile page
      const badge = document.getElementById('ollama-status-badge');
      if (badge) {
        badge.outerHTML = renderOllamaStatusBadgeHTML();
      }
      return connected;
    }

    async function callOllamaChat(userPrompt, conversationHistory = []) {
      const systemPrompt = "You are StudyPath Assistant, a rigorous, clear, and scholarly educational tutor. Your task is to provide step-by-step problem resolutions, clear mathematical proofs, and conceptual clarity across STEM disciplines. Keep explanations structured with clear headings, numbered steps, and readable formulas. Avoid decorative filler.";

      const historyFormatted = conversationHistory
        .filter(m => !m.isThinking && !m.isError)
        .slice(-6)
        .map(m => ({
          role: m.role,
          content: m.text
        }));

      const messages = [
        { role: 'system', content: systemPrompt },
        ...historyFormatted,
        { role: 'user', content: userPrompt }
      ];

      const payload = {
        model: OLLAMA_CONFIG.model,
        messages: messages,
        stream: false
      };

      // Attempt 1: Call through server.js proxy
      try {
        const res = await fetch(OLLAMA_CONFIG.proxyEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const data = await res.json();
          if (data.message && data.message.content) {
            OLLAMA_CONFIG.isConnected = true;
            return {
              success: true,
              text: data.message.content,
              source: `Ollama (${OLLAMA_CONFIG.model})`
            };
          }
        }
      } catch (e) {
        // Fallback to direct fetch
      }

      // Attempt 2: Direct call to Ollama (http://localhost:11434/api/chat)
      try {
        const res = await fetch(`${OLLAMA_CONFIG.endpoint}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          mode: 'cors'
        });
        if (res.ok) {
          const data = await res.json();
          if (data.message && data.message.content) {
            OLLAMA_CONFIG.isConnected = true;
            return {
              success: true,
              text: data.message.content,
              source: `Ollama (${OLLAMA_CONFIG.model})`
            };
          }
        }
      } catch (e) {
        // Direct call failed
      }

      OLLAMA_CONFIG.isConnected = false;
      return {
        success: false,
        error: 'Ollama service is currently not responding on localhost:11434 with model ' + OLLAMA_CONFIG.model + '.'
      };
    }

    function showToast(message) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<svg class="icon icon-sm"><polyline points="20 6 9 17 4 12"/></svg> <span>${message}</span>`;

       ========================================================================== */
    let currentRoute = 'dashboard';
    let activeQuizState = null;
    let lastQuizResult = null;

    function navigateTo(route, params = null) {
      currentRoute = route;
      window.location.hash = route;

      // Update nav link active classes
      const navLinks = ['dashboard', 'bank', 'assistant', 'progress'];
      navLinks.forEach(id => {
        const el = document.getElementById('nav-' + id);
        if (el) {
          if (route === id || (route === 'question-bank' && id === 'bank')) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      });

      const root = document.getElementById('app-root');
      window.scrollTo(0, 0);

      switch (route) {
        case 'home':
          renderHomePage(root);
          break;
        case 'dashboard':
          renderDashboardPage(root);
          break;
        case 'question-bank':
        case 'bank':
          renderQuestionBankPage(root, params);
          break;
        case 'quiz':
          renderQuizPage(root, params);
          break;
        case 'results':
          renderResultsPage(root);
          break;
        case 'progress':
          renderProgressPage(root);
          break;
        case 'assistant':
          renderAssistantPage(root, params);
          break;
        case 'profile':
          renderProfilePage(root);
          break;
        case 'auth':
          renderAuthPage(root);
          break;
        default:
          renderDashboardPage(root);
      }
    }

    function updateBankSubject(sub) {
      currentBankSubject = sub;
      renderQuestionBankPage(document.getElementById('app-root'));
    }

      currentBankDifficulty = diff;
      renderQuestionBankPage(document.getElementById('app-root'));
    }

    function updateBankSearch(query) {
      bankSearchQuery = query;
      // Debounced or direct re-render without losing input focus
      const filteredCountEl = document.querySelector('.container');
      if (filteredCountEl) {
        renderQuestionBankPage(document.getElementById('app-root'));
        const input = document.getElementById('bank-search-input');
        if (input) {
          input.focus();
          input.selectionStart = input.selectionEnd = input.value.length;
        }
      }
    }

    function resetBankFilters() {
      currentBankSubject = 'All';
      currentBankDifficulty = 'All';
      bankSearchQuery = '';
      renderQuestionBankPage(document.getElementById('app-root'));
    }

    function toggleBankExplanation(id) {
      const el = document.getElementById('explanation-' + id);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    }

    /* ==========================================================================
       7. PAGE VIEW: QUIZ ENGINE (CONCENTRATION-FOCUSED & DISTRACTION-FREE)
       ========================================================================== */
    function startQuickQuiz(subject = 'All') {
      let pool = QUESTION_BANK;
      if (subject !== 'All') {
        pool = QUESTION_BANK.filter(q => q.subject === subject);
      }
      // Pick up to 5 questions
      const selectedQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 5);
      initiateQuizSession('Diagnostic Assessment (' + subject + ')', selectedQuestions);
    }

    function startSubjectQuiz(subject) {
      const selectedQuestions = QUESTION_BANK.filter(q => q.subject === subject).slice(0, 5);
      initiateQuizSession(subject + ' Comprehensive Practice', selectedQuestions);
    }

    function startSingleQuestionQuiz(questionId) {
      const q = QUESTION_BANK.find(item => item.id === questionId);
      if (q) {
        initiateQuizSession('Practice: ' + q.topic, [q]);
      }
    }

    function startFilteredQuiz() {
      const filtered = QUESTION_BANK.filter(q => {
        const matchesSubject = (currentBankSubject === 'All' || q.subject === currentBankSubject);
        const matchesDiff = (currentBankDifficulty === 'All' || q.difficulty === currentBankDifficulty);
        const matchesSearch = bankSearchQuery.trim() === '' ||
          q.question.toLowerCase().includes(bankSearchQuery.toLowerCase()) ||
          q.topic.toLowerCase().includes(bankSearchQuery.toLowerCase());
        return matchesSubject && matchesDiff && matchesSearch;
      });
      if (filtered.length === 0) {
        showToast('No questions match the current filters.');
        return;
      }
      initiateQuizSession('Practice Module: ' + currentBankSubject, filtered.slice(0, 10));
    }

    function initiateQuizSession(title, questions) {
      activeQuizState = {
        title: title,
        questions: questions,
        currentIndex: 0,
        userAnswers: new Array(questions.length).fill(null),
        flagged: new Array(questions.length).fill(false),
        startTime: Date.now(),
        timerInterval: null,
        secondsElapsed: 0
      };

      navigateTo('quiz');
    }

      if (!activeQuizState || !activeQuizState.questions.length) {
        navigateTo('dashboard');
        return;

      const qIndex = activeQuizState.currentIndex;
      const currentQ = activeQuizState.questions[qIndex];
      const totalQ = activeQuizState.questions.length;
      const selectedAnswer = activeQuizState.userAnswers[qIndex];
      const isFlagged = activeQuizState.flagged[qIndex];

      const progressPct = Math.round(((qIndex + 1) / totalQ) * 100);

      root.innerHTML = `

          </div>

          <div class="progress-bar-bg" style="margin-bottom: 24px;">
            <div class="progress-bar-fill" style="width: ${progressPct}%;"></div>
          </div>

          <!-- QUESTION CARD (WHITE, 1PX BORDER, 8PX RADIUS) -->
          <div class="card" style="margin-bottom: 24px; padding: 28px;">
            <div class="flex-between" style="margin-bottom: 14px;">
              <div class="flex-gap">
                <span class="badge">${currentQ.subject}</span>
                <span class="badge" style="background-color: transparent;">Topic: ${currentQ.topic}</span>

                <button class="btn btn-primary" onclick="submitQuiz()">

          if (timerDisplay) {
            const m = String(Math.floor(activeQuizState.secondsElapsed / 60)).padStart(2, '0');
            const s = String(activeQuizState.secondsElapsed % 60).padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
          }
        }, 1000);

    function selectQuizAnswer(optIdx) {
      if (!activeQuizState) return;
      activeQuizState.userAnswers[activeQuizState.currentIndex] = optIdx;
      renderQuizPage(document.getElementById('app-root'));
    }

    function clearCurrentAnswer() {
      if (!activeQuizState) return;
      activeQuizState.userAnswers[activeQuizState.currentIndex] = null;
      renderQuizPage(document.getElementById('app-root'));
    }

    function toggleFlagCurrentQuestion() {
      if (!activeQuizState) return;
      const idx = activeQuizState.currentIndex;
      activeQuizState.flagged[idx] = !activeQuizState.flagged[idx];
      renderQuizPage(document.getElementById('app-root'));
    }

    function jumpToQuestion(idx) {
      if (!activeQuizState) return;
      activeQuizState.currentIndex = idx;
      renderQuizPage(document.getElementById('app-root'));
    }

    function nextQuestion() {
      if (!activeQuizState) return;
      if (activeQuizState.currentIndex < activeQuizState.questions.length - 1) {
        activeQuizState.currentIndex++;
        renderQuizPage(document.getElementById('app-root'));
      }
    }

    function prevQuestion() {
      if (!activeQuizState) return;
      if (activeQuizState.currentIndex > 0) {
        activeQuizState.currentIndex--;
        renderQuizPage(document.getElementById('app-root'));
      }
    }

    function confirmExitQuiz() {
      if (confirm('Are you sure you want to exit? Your answers for this attempt will not be saved.')) {
        if (activeQuizState && activeQuizState.timerInterval) {
          clearInterval(activeQuizState.timerInterval);
        }
        activeQuizState = null;
        navigateTo('dashboard');
      }
    }

    function submitQuiz() {
      if (!activeQuizState) return;
      const unanswered = activeQuizState.userAnswers.filter(a => a === null).length;
      if (unanswered > 0) {
        if (!confirm(`You have ${unanswered} unanswered question(s). Are you sure you want to submit?`)) {
          return;
        }
      }

      // Stop timer
      if (activeQuizState.timerInterval) {
        clearInterval(activeQuizState.timerInterval);
      }

      // Compute score
      let correctCount = 0;
      activeQuizState.questions.forEach((q, idx) => {
        if (activeQuizState.userAnswers[idx] === q.correctIndex) {
          correctCount++;
        }
      });

      const total = activeQuizState.questions.length;
      const pct = Math.round((correctCount / total) * 100);
      const minutes = Math.floor(activeQuizState.secondsElapsed / 60);
      const seconds = activeQuizState.secondsElapsed % 60;
      const durationStr = `${minutes}m ${String(seconds).padStart(2, '0')}s`;

      lastQuizResult = {
        title: activeQuizState.title,
        questions: activeQuizState.questions,
        userAnswers: [...activeQuizState.userAnswers],
        correctCount: correctCount,
        total: total,
        scorePct: pct,
        duration: durationStr,
        submittedAt: new Date().toISOString().split('T')[0]
      };

      // Record to user history
      const history = getHistory();
      history.unshift({
        id: 'quiz-' + Date.now(),
        title: activeQuizState.title,
        subject: activeQuizState.questions[0].subject,
        score: correctCount,
        total: total,
        date: lastQuizResult.submittedAt,
        duration: durationStr
      });
      saveHistory(history);

      activeQuizState = null;
      navigateTo('results');
    }

    function exportDataSummary() {
      const history = getHistory();

      const exportObj = {

        target: user.targetExam,
        exportDate: new Date().toISOString(),
        testsCompleted: history.length,

      if (res.success) {

    function generateEducationalResponse(query) {
      const lower = query.toLowerCase();

      if (lower.includes('bayes') || lower.includes('probability')) {
        return `**Bayes' Theorem Breakdown:**

Bayes' theorem calculates conditional probability: the probability of event A occurring given that event B has already occurred.

**Mathematical Formulation:**
\`P(A|B) = [P(B|A) · P(A)] / P(B)\`

Where:
1. **P(A|B)**: Posterior probability.
2. **P(B|A)**: Likelihood of observing evidence B given A is true.
3. **P(A)**: Prior probability of hypothesis A before observing evidence.
4. **P(B)**: Marginal probability of evidence B across all outcomes:
\`P(B) = P(B|A)·P(A) + P(B|not A)·P(not A)\`

**Practical Example (Medical Diagnostic Screening):**
If a disease has 1% prevalence (\`P(D) = 0.01\`), a test has 95% sensitivity (\`P(T|D) = 0.95\`), and a 5% false positive rate (\`P(T|not D) = 0.05\`):
- Numerator = 0.95 × 0.01 = 0.0095
- Denominator = 0.0095 + (0.05 × 0.99) = 0.059
- \`P(D|T) = 0.0095 / 0.059 ≈ 16.1%\`

Even with 95% test accuracy, a positive result only indicates a 16.1% true positive chance due to the low base rate of the disease.`;
      }

      if (lower.includes('quadratic') || lower.includes('derivation')) {
        return `**Step-by-Step Derivation of the Quadratic Formula:**

We wish to solve the general quadratic equation for x:
\`ax² + bx + c = 0\`  (where a ≠ 0)

**Step 1: Divide entire equation by a**
\`x² + (b/a)x + c/a = 0\`

**Step 2: Move the constant term to the right side**
\`x² + (b/a)x = -c/a\`

**Step 3: Complete the square**
Take half of the linear coefficient \`(b/2a)\` and square it: \`(b/2a)² = b² / (4a²)\`.
Add this to both sides:
\`x² + (b/a)x + b²/(4a²) = -c/a + b²/(4a²)\`

**Step 4: Express the left side as a perfect square**
\`(x + b/(2a))² = (b² - 4ac) / (4a²)\`

**Step 5: Take the square root of both sides**
\`x + b/(2a) = ± √(b² - 4ac) / (2a)\`

**Step 6: Subtract b/(2a)**
\`x = [-b ± √(b² - 4ac)] / (2a)\`

The expression \`Δ = b² - 4ac\` is the discriminant:
- \`Δ > 0\`: Two distinct real roots
- \`Δ = 0\`: Exactly one real double root
- \`Δ < 0\`: Two complex conjugate roots`;
      }

      if (lower.includes('newton') || lower.includes('circular motion')) {
        return `**Newton's Third Law in Circular Motion:**

Newton's Third Law states: *"When body A exerts a force on body B, body B simultaneously exerts an equal and opposite force on body A."*

**Centripetal Force vs. Reaction Force:**
In uniform circular motion, an object of mass m moving at tangential speed v around a circle of radius r requires a net inward force:
\`F_c = m·v² / r\`

1. **Action Force:** The physical agent (e.g., tension in a string, gravitational pull from Earth, or normal force from a curved wall) exerts centripetal force inward on the revolving object.
2. **Reaction Force:** The revolving object exerts an equal and opposite force outward on that agent (e.g., the string feels pulled outward by the ball).

**Common Misconception:**
The so-called "centrifugal force" is NOT the reaction pair to centripetal force in an inertial frame. Centrifugal force is a pseudo-force observed only in a rotating non-inertial reference frame. In an inertial frame, the only real force acting on the object is directed inward.`;
      }

      if (lower.includes('chatelier') || lower.includes('equilibrium')) {
        return `**Le Chatelier's Principle in Chemical Equilibrium:**

**Principle Definition:**
When a system at chemical equilibrium experiences a change in concentration, temperature, volume, or pressure, the system counteracts the applied stress by shifting equilibrium position in the direction that opposes that change.

**Key Scenarios:**
1. **Concentration:**
   - Adding reactant shifts equilibrium **forward (right)**.
   - Adding product shifts equilibrium **backward (left)**.

2. **Pressure and Volume (Gas phase):**
   - Increasing pressure (reducing volume) shifts equilibrium toward the side with **fewer gas moles**.
   - Example: \`N₂(g) + 3H₂(g) ⇌ 2NH₃(g)\` (4 moles gas → 2 moles gas). High pressure shifts the reaction to produce more \`NH₃\`.

3. **Temperature:**
   - Treat heat as a reactant in endothermic reactions (\`ΔH > 0\`) and as a product in exothermic reactions (\`ΔH < 0\`).
   - For exothermic reactions, increasing temperature shifts equilibrium **backward (left)**, decreasing the equilibrium constant K.`;
      }

      if (lower.includes('practice') || lower.includes('big-o') || lower.includes('complexity')) {
        return `**3 Quick Practice Questions: Computational Complexity & Big-O**

**Question 1:**
What is the tight asymptotic time complexity of finding the median element in an unsorted array of n elements?
- A) O(n log n)
- B) O(n) using Median of Medians (Quickselect)
- C) O(1)
- D) O(n²)
*Key insight: Quickselect achieves expected O(n) and worst-case O(n) with deterministic pivot.*

**Question 2:**
If a recursive divide-and-conquer algorithm satisfies \`T(n) = 2T(n/2) + O(n)\`, what is its Big-O time complexity?
- Solution: By the Master Theorem (Case 2, where \`log_b(a) = log_2(2) = 1\` and \`f(n) = O(n¹)\`), \`T(n) = Θ(n log n)\`. (Standard MergeSort).

**Question 3:**
Can a comparison-based sorting algorithm ever beat \`O(n log n)\` in the worst case?
- Solution: No. A comparison sort must distinguish between \`n!\` permutations. The minimum depth of any decision tree is \`log₂(n!) = Ω(n log n)\`.

Would you like to practice these concepts inside a timed quiz module? Click "Question Bank" in the top bar!`;
      }

      // Default scholarly response
      return `**Analysis of Your Query:**

"${query}"

In systematic problem solving for STEM examinations:
1. **Clarify the Governing Principle:** Identify whether the problem is governed by conservation laws (energy, momentum, mass), rate kinetics, or mathematical invariants.
2. **Formulate Knowns and Boundary Conditions:** Write down given variables with standard SI units.
3. **Execute Step-by-Step Derivation:** Avoid skipping intermediate steps to prevent arithmetic and sign errors.
4. **Sanity Check:** Verify physical dimensions/units and check limiting behavior (e.g., when x → 0 or x → ∞).

Would you like me to generate a tailored diagnostic question on this topic or walk through a specific numerical derivation?`;
    }
